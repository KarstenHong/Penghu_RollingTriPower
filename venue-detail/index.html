<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>據點詳細介紹</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <a href="javascript:history.back()" class="back-button">&larr; 返回地圖</a>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    const venueId = new URLSearchParams(location.search).get("venue") || "";
    const sport = new URLSearchParams(location.search).get("sport") || "";

    async function init() {
      await Promise.all([loadSportTypes(), loadActivityTypes()]);

      const [venue, allCourses] = await Promise.all([
        getById("venues", venueId),
        getAll("courses"),
      ]);

      const el = document.getElementById("content");
      if (!venue) {
        el.innerHTML = '<p class="hint-text">找不到這個據點，可能已經被移除。</p>';
        return;
      }

      document.title = venue.name + " - " + SITE_NAME;
      const relatedCourses = allCourses.filter((c) => c.venueId === venueId && (!sport || c.sportType === sport));

      el.innerHTML = `
        ${venue.photoUrl ? `<img class="venue-photo" src="${escapeHtml(venue.photoUrl)}" alt="" loading="lazy" />` : ""}
        <h1>${escapeHtml(venue.name)} <span class="venue-type">(${venueTypeName(venue.type)})</span></h1>
        <p>所在地區：${townshipName(venue.township)}</p>
        <p>上課地點／地址：${escapeHtml(venue.address)}</p>
        <p>聯絡電話：${escapeHtml(venue.phone)}</p>
        <p>提供運動項目：${(venue.sportTypes || []).map(sportName).join("、")}</p>
        <h2>課程資訊</h2>
        ${relatedCourses.length ? relatedCourses.map(renderCourseCard).join("") : '<p class="hint-text">目前這個據點還沒有課程資料。</p>'}
      `;
    }

    init().catch((err) => showLoadError("content", err));
  </script>
</body>
</html>
