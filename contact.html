<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聯絡我們 - 澎湖縣滾動三力學運動地圖資訊平台</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>聯絡我們（各社區協會）</h1>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    async function init() {
      const associations = await getAll("associations");
      const el = document.getElementById("content");

      if (!associations.length) {
        el.innerHTML = '<p class="hint-text">目前沒有聯絡資料。</p>';
        return;
      }

      const groups = {};
      associations.forEach((a) => {
        (groups[a.township] = groups[a.township] || []).push(a);
      });

      let html = "";
      Object.keys(groups).forEach((townshipId) => {
        html += `<h2>${townshipName(townshipId)}</h2><div class="venue-list">`;
        groups[townshipId].forEach((a) => {
          html += `
            <div class="venue-card">
              <h3>${escapeHtml(a.name)}</h3>
              <p>電話：${escapeHtml(a.phone)}</p>
              <p>地址：${escapeHtml(a.address)}</p>
            </div>`;
        });
        html += "</div>";
      });
      el.innerHTML = html;
    }

    init();
  </script>
</body>
</html>
