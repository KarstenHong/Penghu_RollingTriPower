    // 課程時間是自由填寫文字，猜不到就抓常見的上下午時段當預設值，範例資料的搜尋篩選才有東西可以篩
    function inferTimeSlot(schedule) {
      if (/09:00|09:30|10:00|11:00|11:30/.test(schedule)) return "weekday-morning";
      if (/14:00|15:00|16:00/.test(schedule)) return "weekday-afternoon";
      if (/18:00|19:00|20:00/.test(schedule)) return "weekday-evening";
      return "";
    }

    async function seed() {
      const btn = document.getElementById("seed-button");
      const statusEl = document.getElementById("status");
      btn.disabled = true;
      statusEl.innerHTML = "<p>匯入中，請稍候...</p>";

      const venueIds = [];
      for (const v of SAMPLE_VENUES_COURSES.venues) {
        const { name, township, type, address, phone, lat, lng, sportTypes } = v;
        const id = await addItem("venues", { name, township, type, address, phone, lat, lng, sportTypes });
        venueIds.push(id);
      }

      for (const c of SAMPLE_VENUES_COURSES.courses) {
        await addItem("courses", {
          venueId: venueIds[c.venueRef],
          sportType: c.sportType,
          schedule: c.schedule,
          description: c.description,
          iconKey: c.sportType,
          status: c.status || "enrolling",
          timeSlot: c.timeSlot || inferTimeSlot(c.schedule),
          startDate: c.startDate || "",
          endDate: c.endDate || "",
          targetAudience: c.targetAudience || "",
          instructorTeam: c.instructorTeam || "",
          fee: c.fee || "",
          registrationMethod: c.registrationMethod || "",
          accessibilityInfo: c.accessibilityInfo || "",
          otherNotes: c.otherNotes || "",
        });
      }

      for (const p of SAMPLE_REST.posts) await addItem("posts", p);
      for (const f of SAMPLE_REST.faq) await addItem("faq", f);
      for (const a of SAMPLE_REST.associations) await addItem("associations", a);

      statusEl.innerHTML = `<p class="success-text">匯入完成！共新增 ${venueIds.length} 個據點、${SAMPLE_VENUES_COURSES.courses.length} 筆課程、${SAMPLE_REST.posts.length} 則公告、${SAMPLE_REST.faq.length} 筆常見問題、${SAMPLE_REST.associations.length} 筆協會聯絡資訊。</p>`;
      btn.disabled = false;
    }
