<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>忘記密碼</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>忘記密碼</h1>
    <p class="hint-text">輸入註冊時使用的電子郵件，我們會寄一封重設密碼的信給您，請至信箱點選信中的連結重設密碼。</p>

    <form class="member-form" id="forgot-form">
      <label>電子郵件 <input type="email" id="email" required /></label>
      <button type="submit" class="primary-button">寄送重設密碼信</button>
    </form>

    <p class="error-text" id="error" style="display: none;">寄送失敗，請確認電子郵件是否正確。</p>
    <p class="success-text" id="success" style="display: none;">重設密碼信已寄出，請至信箱查收（含垃圾郵件匣）。</p>
    <p><a href="/login/">返回登入</a></p>
  </main>

  <script>
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("error").style.display = "none";
      document.getElementById("success").style.display = "none";
      try {
        await sendPasswordReset(document.getElementById("email").value);
        document.getElementById("success").style.display = "block";
      } catch (err) {
        document.getElementById("error").style.display = "block";
      }
    });
  </script>
</body>
</html>
