<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>澎湖縣社區運動資源查詢</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/map-data.js"></script>
  <script src="js/highlights.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="hero-banner" id="hero-banner"></div>
    <p class="hero-tagline">台灣海峽最美麗的明珠・澎湖縣</p>

    <h1>澎湖縣社區運動資源查詢</h1>
    <p class="hint-text">請點選地圖上您想查詢的鄉鎮</p>

    <div class="font-size-controls">
      <span>字體大小：</span>
      <button onclick="setFontSize('')">標準</button>
      <button onclick="setFontSize('text-large')">大</button>
      <button onclick="setFontSize('text-xlarge')">特大</button>
    </div>

    <div class="map-wrap" id="map"></div>
    <p class="photo-credit" id="photo-credits"></p>
  </main>

  <script>
    renderPenghuMap("map");

    const heroTownships = ["qimei", "baisha", "magong"];
    document.getElementById("hero-banner").innerHTML = heroTownships
      .map((id) => `<img src="${TOWNSHIP_HIGHLIGHTS[id].image}" alt="${escapeHtml(TOWNSHIP_HIGHLIGHTS[id].landmarkName)}" loading="lazy" />`)
      .join("");

    document.getElementById("photo-credits").innerHTML =
      "首頁圖片來源：" + heroTownships.map((id) => {
        const h = TOWNSHIP_HIGHLIGHTS[id];
        return `<a href="${escapeHtml(h.sourceUrl)}" target="_blank" rel="noopener">${escapeHtml(h.credit)}</a>`;
      }).join("；");
  </script>
</body>
</html>
