<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>澎湖縣社區運動資源查詢</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/map-data.js"></script>
  <script src="js/highlights.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="photo-strip" id="photo-strip"></div>

    <h1>澎湖縣社區運動資源查詢</h1>
    <p class="hint-text">請點選地圖上的鄉鎮，或直接點下面的鄉鎮名稱</p>

    <div class="font-size-controls">
      <span>字體大小：</span>
      <button onclick="setFontSize('')">標準</button>
      <button onclick="setFontSize('text-large')">大</button>
      <button onclick="setFontSize('text-xlarge')">特大</button>
    </div>

    <div class="map-wrap" id="map"></div>

    <div class="township-buttons" id="township-buttons"></div>
  </main>

  <script>
    renderPenghuMap("map");

    document.getElementById("photo-strip").innerHTML =
      GENERAL_PHOTOS.map((p) => `<img src="${p.image}" alt="" loading="lazy" />`).join("") +
      `<span class="bg-credit">來源：${GENERAL_PHOTOS.map((p) => `<a href="${escapeHtml(p.sourceUrl)}" target="_blank" rel="noopener">${escapeHtml(p.credit)}</a>`).join("、")}</span>`;

    document.getElementById("township-buttons").innerHTML = TOWNSHIPS.map((t) => `
      <a class="township-button" href="township.html?id=${t.id}">${t.name}</a>
    `).join("");
  </script>
</body>
</html>
