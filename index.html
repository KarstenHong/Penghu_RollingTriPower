<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>澎湖縣三力運動地圖 - 「滾動三力學」正在澎湖不同社區持續滾動。透過地圖尋找鄰近的課程據點，查看上課時間、招生狀態與聯絡方式，一起加入動身體、想策略、交朋友的健康行列。</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/highlights.js"></script>
</head>
<body class="hero-page">
  <section class="hero-section">
    <div class="hero-bg-photos" id="hero-bg-photos"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>澎湖縣三力運動地圖資訊平台</h1>
      <p>「滾動三力學」正在澎湖不同社區持續滾動。透過地圖尋找鄰近的課程據點，查看上課時間、招生狀態與聯絡方式，一起加入動身體、想策略、交朋友的健康行列。</p>
      <a href="home-map.html" class="hero-cta">開始</a>
    </div>
  </section>

  <script>
    document.getElementById("hero-bg-photos").innerHTML = GENERAL_PHOTOS.map(
      (p) => `<img src="${p.image}" alt="" title="圖片來源：${escapeHtml(p.credit)}" loading="lazy" />`
    ).join("");

    // 點「開始」不要立刻跳頁，先讓背景照片放大、畫面漸暗，做出「往前走進去」的感覺，
    // 放完轉場動畫再真的換頁（純多頁式網站沒有跨頁動畫，用這個方式做出銜接感）
    document.querySelector(".hero-cta").addEventListener("click", (e) => {
      e.preventDefault();
      const href = e.currentTarget.getAttribute("href");
      document.querySelector(".hero-section").classList.add("leaving");
      setTimeout(() => { location.href = href; }, 750);
    });
  </script>
</body>
</html>
