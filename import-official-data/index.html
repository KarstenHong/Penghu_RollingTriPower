    const OLD_DEMO_SPORT_TYPE_IDS = ["taichi", "folkdance", "croquet", "tabletennis", "badminton", "aerobics", "yoga", "walking"];

    function log(msg) {
      document.getElementById("log").insertAdjacentHTML("beforeend", `<p>${escapeHtml(msg)}</p>`);
    }

    async function run() {
      const btn = document.getElementById("run-btn");
      btn.disabled = true;
      document.getElementById("log").innerHTML = "";

      log("刪除展示用據點與課程資料...");
      const [oldVenues, oldCourses] = await Promise.all([getAll("venues"), getAll("courses")]);
      for (const v of oldVenues) await deleteItem("venues", v.id);
      for (const c of oldCourses) await deleteItem("courses", c.id);
      log(`已刪除 ${oldVenues.length} 個舊據點、${oldCourses.length} 筆舊課程。`);

      log("移除展示用的運動項目（太極拳／土風舞…8 種），改建立正式的「地板滾球」...");
      for (const id of OLD_DEMO_SPORT_TYPE_IDS) await deleteItem("sportTypes", id);
      await setItem("sportTypes", "floorcurling", { name: "地板滾球", icon: "/images/icons/floorcurling.svg", active: true });

      log("匯入正式據點與課程資料...");
      for (const item of OFFICIAL_DATA) {
        const venueId = await addItem("venues", {
          name: item.name,
          township: item.township,
          type: "association",
          address: item.address,
          phone: item.phone,
          sportTypes: ["floorcurling"],
          lat: null,
          lng: null,
          photoUrl: "",
        });
        await addItem("courses", {
          venueId,
          sportType: "floorcurling",
          schedule: item.course.schedule,
          description: item.course.description,
          timeSlot: item.course.timeSlot || "",
          status: "ongoing",
          startDate: item.course.startDate || "",
          endDate: item.course.endDate || "",
          targetAudience: "",
          instructorTeam: item.course.instructorTeam || "",
          fee: "",
          registrationMethod: item.course.registrationMethod || "",
          accessibilityInfo: "",
          otherNotes: "",
        });
        log(`已建立：${item.name}`);
      }

      btn.textContent = "已完成";
    }

    document.getElementById("run-btn").addEventListener("click", run);
