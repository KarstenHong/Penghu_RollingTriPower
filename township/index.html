<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鄉鎮運動資源</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/map-data.js"></script>
  <script src="/js/highlights.js"></script>
</head>
<body class="township-detail">
  <div class="township-bg" id="township-bg"></div>
  <div id="nav"></div>
  <main>
    <a href="/sports-map/" class="back-button">&larr; 返回地圖</a>
    <h1 id="township-title"></h1>

    <p class="hint-text" id="marker-hint"></p>

    <div class="map-wrap" id="township-map"></div>
    <p class="hint-text" id="empty-hint" style="display: none;">目前這個鄉鎮還沒有資料。</p>
  </main>

  <div class="marker-tooltip" id="marker-tooltip" hidden></div>

  <script>
    const townshipId = new URLSearchParams(location.search).get("id") || "";
    document.getElementById("township-title").textContent = townshipName(townshipId);

    const highlight = TOWNSHIP_HIGHLIGHTS[townshipId];
    if (highlight) {
      document.getElementById("township-bg").innerHTML =
        `<img src="${highlight.image}" alt="" title="圖片來源：${escapeHtml(highlight.credit)}" loading="lazy" />`;
    }

    let venues = [];
    let courses = [];

    // 圖示在畫面上的最小像素大小（手機螢幕地圖縮得小，圖示比例縮放後容易小到看不清楚／點不準）
    const MOBILE_MIN_MARKER_PX = 34;

    // 觸控裝置沒有滑鼠懸停，改成「點第一下看簡要資訊、點第二下（同一個圖示）才進入完整介紹」，
    // 避免一點就直接跳頁、還沒看到簡要資訊
    const canHover = window.matchMedia("(hover: hover)").matches;
    let activeTouchMarker = null;

    document.getElementById("marker-hint").textContent = canHover
      ? "滑鼠移到地圖上的圖示可以看簡要資訊，點擊圖示可以看完整介紹"
      : "點一下圖示可以看簡要資訊，再點一次同一個圖示可以看完整介紹";

    // 點地圖上圖釘以外的地方，取消目前選取的圖釘；只要註冊一次即可，不需要每次重畫圖釘都重新加一份
    if (!canHover) {
      document.addEventListener("click", (e) => {
        if (activeTouchMarker && !e.target.closest(".map-marker-hit")) {
          activeTouchMarker = null;
          hideMarkerTooltip();
        }
      });
    }

    async function init() {
      renderTownshipMap("township-map", townshipId);
      await Promise.all([loadSportTypes(), loadActivityTypes()]);
      const [allVenues, allCourses] = await Promise.all([getAll("venues"), getAll("courses")]);
      venues = allVenues.filter((v) => v.township === townshipId);
      courses = allCourses;
      document.getElementById("empty-hint").style.display = venues.length ? "none" : "block";
      renderMarkers();

      // 轉螢幕方向或縮放視窗時地圖寬度會變，圖示的最小像素下限要跟著重算
      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderMarkers, 150);
      });
    }

    // 把每個「據點＋運動」畫成地圖上的一個圖示圖釘，同一據點有多項運動時左右錯開避免疊在一起。
    // 圖釘本身就是互動入口：滑鼠移過去看簡要資訊，點擊或按 Enter 進入該據點的完整介紹頁面
    function renderMarkers() {
      const group = document.getElementById("township-map-markers");
      const t = PENGHU_MAP.townships[townshipId];
      if (!group || !t) return;

      // 重畫圖釘（例如 resize 觸發）會把舊的圖釘節點整個換掉，先前選取的圖釘節點就沒了，
      // 沒有清掉的話「點兩下才進入介紹頁」的判斷會一直卡在已經不存在的舊節點上
      if (!canHover) {
        activeTouchMarker = null;
        hideMarkerTooltip();
      }

      const byVenue = {};
      venues.forEach((v) => {
        if (v.lat == null || v.lng == null) return;
        (v.sportTypes || []).forEach((sport) => {
          (byVenue[v.id] = byVenue[v.id] || { venue: v, sports: [] }).sports.push(sport);
        });
      });

      // 圖示比例是照地圖等比縮放，手機螢幕地圖本身就縮得比較小，圖示會跟著縮到很難看清楚／點準，
      // 這裡量出地圖實際畫面寬度，換算出一個「螢幕最小像素」下限，手機上圖示不會比這個下限更小
      const { vw } = getTownshipViewBox(townshipId);
      const svgEl = document.querySelector("#township-map svg");
      const renderedWidth = svgEl ? svgEl.getBoundingClientRect().width : vw;
      const minSizeRatio = renderedWidth > 0 ? MOBILE_MIN_MARKER_PX / renderedWidth : 0;
      const markerSize = vw * Math.max(getMarkerSizeRatio(), minSizeRatio);
      let svg = "";
      Object.values(byVenue).forEach(({ venue, sports }) => {
        const [px, py] = projectVenueMarker(venue);
        sports.forEach((sport, i) => {
          const offset = (i - (sports.length - 1) / 2) * markerSize * 0.85;
          const cx = px + offset;
          const x = cx - markerSize / 2;
          const y = py - markerSize / 2;
          // 白色底盤墊在圖示後面：運動圖示的顏色偶爾會跟該鄉鎮的地圖底色一樣，疊在一起會看不清楚，
          // 白底不管地圖是什麼顏色都有足夠對比。客戶反映運動項目目前都是同一種（地板滾球），
          // 圖示在地圖上看不出「滾動三力學課程據點」跟「地板滾球活動據點」的差別——這不該靠改運動
          // 項目來解決（運動項目還要給搜尋篩選「這個據點有沒有教地板滾球」用，兩種據點都算有），
          // 改成底盤外圈用活動類型的顏色當圈邊，同一個地板滾球圖示套不同顏色的圈就能一眼分辨，
          // 之後後台新增第三種活動類型、換顏色，這裡也會自動跟著變，不用再改程式。
          const course = courses.find((c) => c.venueId === venue.id && c.sportType === sport);
          const ringColor = course && course.activityType ? activityTypeColor(course.activityType) : "rgba(0,0,0,0.2)";
          const ariaType = course && course.activityType ? `，${activityTypeName(course.activityType)}` : "";
          svg += `
            <g class="map-marker-hit" tabindex="0" role="button" data-venue="${venue.id}" data-sport="${sport}" aria-label="${escapeHtml(venue.name)} - ${sportName(sport)}${ariaType}">
              <circle cx="${cx}" cy="${py}" r="${markerSize * 0.62}" fill="white" stroke="${ringColor}" stroke-width="3" class="map-marker-badge" />
              <image href="${sportIcon(sport)}" x="${x}" y="${y}" width="${markerSize}" height="${markerSize}" class="map-marker" />
            </g>`;
        });
      });
      group.innerHTML = svg;

      group.querySelectorAll(".map-marker-hit").forEach((marker) => {
        const venueId = marker.dataset.venue;
        const sport = marker.dataset.sport;
        const go = () => { location.href = `/venue-detail/?venue=${encodeURIComponent(venueId)}&sport=${encodeURIComponent(sport)}`; };

        if (canHover) {
          marker.addEventListener("mouseenter", (e) => showMarkerTooltip(e, venueId, sport));
          marker.addEventListener("mousemove", moveMarkerTooltip);
          marker.addEventListener("mouseleave", hideMarkerTooltip);
          marker.addEventListener("click", go);
        } else {
          marker.addEventListener("click", (e) => {
            if (activeTouchMarker === marker) { go(); return; }
            e.preventDefault();
            activeTouchMarker = marker;
            showMarkerTooltip(e, venueId, sport);
          });
        }

        marker.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") go(); });
      });
    }

    function showMarkerTooltip(e, venueId, sport) {
      const venue = venues.find((v) => v.id === venueId);
      if (!venue) return;
      const course = courses.find((c) => c.venueId === venueId && c.sportType === sport);
      const status = course && COURSE_STATUS[course.status];

      const tooltip = document.getElementById("marker-tooltip");
      tooltip.innerHTML = `
        <strong>${escapeHtml(venue.name)}</strong>
        <div>${sportName(sport)}${course ? `｜${escapeHtml(course.schedule)}` : ""}</div>
        ${course && course.activityType ? `<span class="activity-type-tag" style="--activity-color: ${activityTypeColor(course.activityType)}">${activityTypeName(course.activityType)}</span>` : ""}
        ${status ? `<span class="status-badge" style="--status-color: ${status.color}">${status.icon} ${escapeHtml(status.label)}</span>` : ""}
      `;
      tooltip.hidden = false;
      moveMarkerTooltip(e);
    }

    function moveMarkerTooltip(e) {
      const tooltip = document.getElementById("marker-tooltip");
      if (tooltip.hidden) return;
      const pad = 16;
      tooltip.style.left = e.clientX + pad + "px";
      tooltip.style.top = e.clientY + pad + "px";

      // 手機螢幕窄，圖釘靠邊時 tooltip 往右/往下開會被切掉，改往左/往上開
      const rect = tooltip.getBoundingClientRect();
      if (rect.right > window.innerWidth) tooltip.style.left = e.clientX - rect.width - pad + "px";
      if (rect.bottom > window.innerHeight) tooltip.style.top = e.clientY - rect.height - pad + "px";
    }

    function hideMarkerTooltip() {
      document.getElementById("marker-tooltip").hidden = true;
    }

    init();
  </script>
</body>
</html>
