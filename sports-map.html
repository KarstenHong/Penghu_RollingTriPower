<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三力運動地圖 - 澎湖縣社區運動資源查詢</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/map-data.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>三力運動地圖</h1>
    <p class="hint-text">「滾動三力學」正在澎湖不同社區持續滾動。透過地圖尋找鄰近的課程據點，查看上課時間、招生狀態與聯絡方式，一起加入動身體、想策略、交朋友的健康行列。</p>

    <div class="map-container">
      <div class="map-wrap" id="map"></div>
      <div class="map-insets">
        <div class="map-inset" id="inset-wangan"></div>
        <div class="map-inset" id="inset-qimei"></div>
      </div>
    </div>
    <p class="hint-text inset-note">望安、七美離本島較遠，用縮圖顯示在左上角方便點選，位置非實際方位</p>
    <p class="hint-text">點選地圖上的鄉鎮，即可查看該地區的課程據點、上課時間與招生狀態</p>

    <div class="township-buttons" id="township-buttons"></div>
  </main>

  <script>
    renderPenghuMap("map", ["magong", "huxi", "baisha", "xiyu"]);
    renderMapInset("inset-wangan", "wangan");
    renderMapInset("inset-qimei", "qimei");

    document.getElementById("township-buttons").innerHTML = TOWNSHIPS.map((t) => `
      <a class="township-button" href="township.html?id=${t.id}" style="--tb-color: ${TOWNSHIP_COLORS[t.id]}">${t.name}</a>
    `).join("");
  </script>
</body>
</html>
