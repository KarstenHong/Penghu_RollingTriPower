<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員資料 - 澎湖縣社區運動資源查詢</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>我的會員資料</h1>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    let uid = null;
    let profile = null;

    function render() {
      const townshipOptions = TOWNSHIPS.map(
        (t) => `<option value="${t.id}" ${profile.township === t.id ? "selected" : ""}>${t.name}</option>`
      ).join("");

      const sportCheckboxes = SPORT_TYPES.map((s) => `
        <label class="checkbox-line">
          <input type="checkbox" value="${s.id}" ${(profile.favoriteSports || []).includes(s.id) ? "checked" : ""} class="sport-checkbox" />
          ${s.name}
        </label>
      `).join("");

      document.getElementById("content").innerHTML = `
        <form class="member-form" id="profile-form">
          <label>姓名 <input type="text" id="name" value="${escapeHtml(profile.name)}" required /></label>
          <label>出生年月日 <input type="date" id="birthDate" value="${escapeHtml(profile.birthDate)}" /></label>
          <label>聯絡電話 <input type="text" id="phone" value="${escapeHtml(profile.phone)}" /></label>
          <label>所在鄉鎮
            <select id="township">
              <option value="">請選擇</option>
              ${townshipOptions}
            </select>
          </label>
          <fieldset>
            <legend>喜愛的運動</legend>
            ${sportCheckboxes}
          </fieldset>
          <button type="submit" class="primary-button">儲存</button>
        </form>
        <p class="success-text" id="saved" style="display: none;">已儲存！</p>
        <button type="button" class="secondary-button" id="logout-button">登出</button>
      `;

      document.getElementById("profile-form").addEventListener("submit", handleSave);
      document.getElementById("logout-button").addEventListener("click", async () => {
        await logoutUser();
        location.href = "index.html";
      });
    }

    async function handleSave(e) {
      e.preventDefault();
      profile.name = document.getElementById("name").value;
      profile.birthDate = document.getElementById("birthDate").value;
      profile.phone = document.getElementById("phone").value;
      profile.township = document.getElementById("township").value;
      profile.favoriteSports = Array.from(document.querySelectorAll(".sport-checkbox:checked")).map((c) => c.value);

      await setItem("users", uid, profile);
      document.getElementById("saved").style.display = "block";
    }

    requireLogin(async (user) => {
      uid = user.uid;
      profile = (await getById("users", uid)) || {
        name: "", birthDate: "", phone: "", township: "", favoriteSports: [], favoriteVenueIds: [], role: "user",
      };
      render();
    });
  </script>
</body>
</html>
