<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成果與資源／聯絡我們</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <div class="page-tabs" role="tablist">
      <button type="button" class="page-tab active" data-tab="results">成果與資源</button>
      <button type="button" class="page-tab" data-tab="contact">聯絡我們</button>
    </div>

    <div data-tab-panel="results">
      <h1>成果與資源</h1>
      <p class="hint-text">學員們參加社區運動的精彩紀錄</p>
      <div id="gallery-content"><p>載入中...</p></div>
    </div>

    <div data-tab-panel="contact" hidden>
      <h1>聯絡我們</h1>
      <div id="contact-content"><p>載入中...</p></div>
    </div>
  </main>

  <script>
    // 相簿列表很輕（快取過），但照片本身是 Base64、很重，不能像相簿一樣整批先抓。
    // 改成先畫出所有相簿的標題和空白格子，捲到快看到某個相簿時才抓那個相簿的照片，
    // 訪客沒捲到的相簿就不會被下載，相簿/照片再多也不會拖慢一開始的載入。
    let photosByAlbum = {};

    // 相簿照片數一多，一次全部展開成格狀畫面會很長、縮圖也載得多，超過這個張數改成預設用
    // 輪播只顯示代表照片，點「查看全部」才展開；張數不多的相簿直接顯示全部，輪播反而多此一舉
    const CAROUSEL_THRESHOLD = 5;
    const CAROUSEL_INTERVAL_MS = 4000;
    let carouselTimers = {}; // albumId -> setInterval id
    let carouselIndex = {}; // albumId -> 目前顯示第幾張

    async function initGallery() {
      const albums = await getAll("albums");
      const el = document.getElementById("gallery-content");

      if (!albums.length) {
        el.innerHTML = '<p class="hint-text">目前還沒有成果照片，敬請期待。</p>';
        return;
      }

      el.innerHTML = albums.map((a) => `
        <h2>${escapeHtml(a.name)}</h2>
        <div class="gallery-grid" id="album-${a.id}" data-album-id="${a.id}"><p class="hint-text">載入中...</p></div>
      `).join("");

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          observer.unobserve(entry.target);
          loadAlbumPhotos(entry.target.dataset.albumId);
        });
      }, { rootMargin: "300px" });

      document.querySelectorAll("#gallery-content [data-album-id]").forEach((grid) => observer.observe(grid));
    }

    async function loadAlbumPhotos(albumId) {
      const grid = document.getElementById(`album-${albumId}`);
      const photos = (await getWhere("gallery", "albumId", albumId)).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      photosByAlbum[albumId] = photos;

      if (!photos.length) {
        // 空相簿：跟原本「只顯示有照片的相簿」的行為一致，把標題也一起拿掉
        grid.previousElementSibling?.remove();
        grid.remove();
        return;
      }

      if (photos.length > CAROUSEL_THRESHOLD) {
        renderCarousel(albumId, photos);
      } else {
        renderFullGrid(albumId, photos);
      }
    }

    function renderFullGrid(albumId, photos) {
      const el = document.getElementById(`album-${albumId}`);
      el.className = "gallery-grid";
      el.innerHTML = photos.map((p, i) => `
        <button type="button" class="gallery-thumb" onclick="openPhoto('${albumId}', ${i})">
          <img src="${escapeHtml(p.imageUrl)}" alt="" loading="lazy" />
          ${p.caption ? `<span class="gallery-caption">${escapeHtml(p.caption)}</span>` : ""}
        </button>
      `).join("");
    }

    // 輪播只放前 5 張代表照片（已經照日期新到舊排序），點照片一樣開燈箱，
    // 燈箱要看的是 photosByAlbum 裡完整的那份資料，索引直接對得起來，不用另外做對照表
    function renderCarousel(albumId, photos) {
      const el = document.getElementById(`album-${albumId}`);
      const preview = photos.slice(0, CAROUSEL_THRESHOLD);
      carouselIndex[albumId] = 0;

      el.className = "gallery-carousel";
      el.innerHTML = `
        <div class="gallery-carousel-viewport">
          ${preview.map((p, i) => `
            <button type="button" class="gallery-carousel-slide${i === 0 ? " active" : ""}" onclick="openPhoto('${albumId}', ${i})">
              <img src="${escapeHtml(p.imageUrl)}" alt="" loading="lazy" />
            </button>
          `).join("")}
          <button type="button" class="gallery-carousel-arrow prev" aria-label="上一張" onclick="carouselStep('${albumId}', ${preview.length}, -1)">&lsaquo;</button>
          <button type="button" class="gallery-carousel-arrow next" aria-label="下一張" onclick="carouselStep('${albumId}', ${preview.length}, 1)">&rsaquo;</button>
        </div>
        <div class="gallery-carousel-dots">
          ${preview.map((_, i) => `<button type="button" class="gallery-carousel-dot${i === 0 ? " active" : ""}" aria-label="第 ${i + 1} 張" onclick="goToCarouselSlide('${albumId}', ${i}, ${preview.length})"></button>`).join("")}
        </div>
        <a href="#" class="table-link-button" onclick="expandAlbum('${albumId}'); return false;">查看全部 ${photos.length} 張 &rarr;</a>
      `;

      startCarouselAutoplay(albumId, preview.length);
      const viewport = el.querySelector(".gallery-carousel-viewport");
      viewport.addEventListener("mouseenter", () => stopCarouselAutoplay(albumId));
      viewport.addEventListener("mouseleave", () => startCarouselAutoplay(albumId, preview.length));
    }

    function goToCarouselSlide(albumId, index, total) {
      carouselIndex[albumId] = index;
      const el = document.getElementById(`album-${albumId}`);
      el.querySelectorAll(".gallery-carousel-slide").forEach((slide, i) => slide.classList.toggle("active", i === index));
      el.querySelectorAll(".gallery-carousel-dot").forEach((dot, i) => dot.classList.toggle("active", i === index));
      // 手動切換（點箭頭/圓點）後重新計時，避免手動切完馬上又被自動播放蓋掉
      if (carouselTimers[albumId]) startCarouselAutoplay(albumId, total);
    }

    function carouselStep(albumId, total, delta) {
      const current = carouselIndex[albumId] || 0;
      goToCarouselSlide(albumId, (current + delta + total) % total, total);
    }

    function startCarouselAutoplay(albumId, total) {
      stopCarouselAutoplay(albumId);
      carouselTimers[albumId] = setInterval(() => carouselStep(albumId, total, 1), CAROUSEL_INTERVAL_MS);
    }

    function stopCarouselAutoplay(albumId) {
      if (!carouselTimers[albumId]) return;
      clearInterval(carouselTimers[albumId]);
      delete carouselTimers[albumId];
    }

    function expandAlbum(albumId) {
      stopCarouselAutoplay(albumId);
      renderFullGrid(albumId, photosByAlbum[albumId]);
    }

    function openPhoto(albumId, i) {
      const p = photosByAlbum[albumId][i];
      const overlay = document.createElement("div");
      overlay.className = "confirm-overlay";
      overlay.innerHTML = `
        <div class="lightbox-dialog">
          <img src="${escapeHtml(p.imageUrl)}" alt="" />
          ${p.caption ? `<p>${escapeHtml(p.caption)}</p>` : ""}
          ${p.date ? `<p class="post-date">${escapeHtml(p.date)}</p>` : ""}
          <button type="button" class="secondary-button" data-close>關閉</button>
        </div>
      `;
      document.body.appendChild(overlay);

      function close() { overlay.remove(); document.removeEventListener("keydown", onKeydown); }
      function onKeydown(e) { if (e.key === "Escape") close(); }

      overlay.addEventListener("click", (e) => {
        if (e.target === overlay || e.target.closest("[data-close]")) close();
      });
      document.addEventListener("keydown", onKeydown);
    }

    async function initContact() {
      const associations = await getAll("associations");
      const el = document.getElementById("contact-content");

      if (!associations.length) {
        el.innerHTML = '<p class="hint-text">目前沒有聯絡資料。</p>';
        return;
      }

      const groups = {};
      associations.forEach((a) => {
        (groups[a.township] = groups[a.township] || []).push(a);
      });

      let html = "";
      Object.keys(groups).forEach((townshipId) => {
        html += `<h2>${townshipName(townshipId)}</h2><div class="venue-list">`;
        groups[townshipId].forEach((a) => {
          html += `
            <div class="venue-card">
              <h3>${escapeHtml(a.name)}</h3>
              <p>電話：${escapeHtml(a.phone)}</p>
              <p>地址：${escapeHtml(a.address)}</p>
            </div>`;
        });
        html += "</div>";
      });
      el.innerHTML = html;
    }

    initGallery();
    initContact();
    initTabs();
  </script>
</body>
</html>
