<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理者帳號管理 - 澎湖縣滾動三力學運動地圖資訊平台</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <a href="admin.html" class="back-button">&larr; 返回後台首頁</a>
    <h1>管理者帳號管理</h1>
    <p class="hint-text">刪除只會移除此帳號的後台權限（Firestore 資料），Firebase Authentication 裡的登入帳號本身仍會存在；若要讓對方完全無法登入，需另外到 Firebase 主控台的 Authentication 頁面手動刪除。</p>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    let admins = [];
    let creating = false;

    async function reload() {
      admins = (await getAll("users")).filter((u) => u.role === "admin");
      render();
    }

    function newAdmin() {
      creating = true;
      render();
    }

    // 建立新帳號會讓瀏覽器自動登入該帳號，所以用第二個獨立的 Firebase App 實例來做，
    // 才不會把目前登入的管理者踢掉；建立完馬上登出並丟掉這個實例
    async function addAdmin(e) {
      e.preventDefault();
      const email = document.getElementById("f-email").value.trim();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = "建立中...";

      const secondaryApp = firebase.initializeApp(firebaseConfig, "admin-create-" + Date.now());
      try {
        const tempPassword = crypto.randomUUID();
        const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, tempPassword);
        await db.collection("users").doc(cred.user.uid).set({ email, role: "admin" });
        await secondaryApp.auth().sendPasswordResetEmail(email);
        await secondaryApp.auth().signOut();
        alert(`已建立管理者帳號，系統已寄送設定密碼信到 ${email}，請對方查收信件設定密碼後即可登入。`);
        creating = false;
        await reload();
      } catch (err) {
        alert("建立失敗：" + (err.message || err));
        btn.disabled = false;
        btn.textContent = "建立";
      } finally {
        await secondaryApp.delete();
      }
    }

    async function removeAdmin(uid) {
      const admin = admins.find((a) => a.id === uid);
      const confirmed = await showConfirmDialog(
        `確定要刪除管理者「${admin.email || admin.id}」的後台權限嗎？`,
        { confirmLabel: "刪除", danger: true },
      );
      if (!confirmed) return;
      await deleteItem("users", uid);
      await reload();
    }

    function render() {
      document.getElementById("content").innerHTML = `
        <button class="primary-button" onclick="newAdmin()" style="display: block; margin: 0.8rem 0 1.2rem;">+ 新增管理者</button>
        <div class="table-scroll"><table class="admin-table">
          <thead><tr><th>Email</th><th></th></tr></thead>
          <tbody>
            ${admins.map((a) => `
              <tr>
                <td>${escapeHtml(a.email || a.id)}</td>
                <td><button onclick="removeAdmin('${a.id}')">刪除</button></td>
              </tr>
            `).join("") || `<tr><td colspan="2">目前沒有管理者帳號。</td></tr>`}
          </tbody>
        </table></div>
      `;

      if (!creating) { renderEditModal(null); return; }

      renderEditModal(`
        <form class="member-form" id="admin-form">
          <label>Email <input type="email" id="f-email" required /></label>
          <p class="hint-text">建立後會寄送「設定密碼」信到這個信箱，對方自行設定密碼即可登入，不用先幫他想密碼。</p>
          <button type="submit" class="primary-button">建立</button>
          <button type="button" class="secondary-button" onclick="creating = false; render();">取消</button>
        </form>
      `, () => { creating = false; render(); });

      document.getElementById("admin-form").addEventListener("submit", addAdmin);
    }

    requireAdmin(() => reload());
  </script>
</body>
</html>
