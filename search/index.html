<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社區活動查詢</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>社區活動查詢</h1>

    <div class="search-filters">
      <label>關鍵字
        <input id="keyword" placeholder="輸入據點名稱或地址" oninput="render()" />
      </label>
      <label>鄉鎮
        <select id="township-filter" onchange="render()">
          <option value="">全部</option>
        </select>
      </label>
      <label>運動類型
        <select id="sport-filter" onchange="render()">
          <option value="">全部</option>
        </select>
      </label>
    </div>

    <div id="results"><p>載入中...</p></div>
  </main>

  <script>
    let venues = [];

    function fillOptions() {
      const t = document.getElementById("township-filter");
      TOWNSHIPS.forEach((x) => t.insertAdjacentHTML("beforeend", `<option value="${x.id}">${x.name}</option>`));
      const s = document.getElementById("sport-filter");
      activeSportTypes().forEach((x) => s.insertAdjacentHTML("beforeend", `<option value="${x.id}">${x.name}</option>`));
    }

    function render() {
      const keyword = document.getElementById("keyword").value.trim().toLowerCase();
      const township = document.getElementById("township-filter").value;
      const sport = document.getElementById("sport-filter").value;

      const filtered = venues.filter((v) =>
        (!keyword || v.name.toLowerCase().includes(keyword) || (v.address || "").toLowerCase().includes(keyword)) &&
        (!township || v.township === township) &&
        (!sport || (v.sportTypes || []).includes(sport))
      );

      const el = document.getElementById("results");
      if (!filtered.length) {
        el.innerHTML = '<p class="hint-text">找不到符合條件的據點，請調整篩選條件。</p>';
        return;
      }

      el.innerHTML = '<div class="venue-list">' + filtered.map((v) => `
        <div class="venue-card">
          ${v.photoUrl ? `<img class="venue-photo" src="${escapeHtml(v.photoUrl)}" alt="" loading="lazy" />` : ""}
          <h3>${escapeHtml(v.name)} <span class="venue-type">(${venueTypeName(v.type)})</span></h3>
          <p>鄉鎮：${townshipName(v.township)}</p>
          <p>地址：${escapeHtml(v.address)}</p>
          <p>電話：${escapeHtml(v.phone)}</p>
          <p>運動項目：${(v.sportTypes || []).map(sportName).join("、")}</p>
        </div>
      `).join("") + "</div>";
    }

    async function init() {
      await loadSportTypes();
      fillOptions();
      venues = await getAll("venues");
      render();
    }

    init();
  </script>
</body>
</html>
