<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社區協會聯絡資訊管理</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <a href="/admin/" class="back-button">&larr; 返回後台首頁</a>
    <h1>社區協會聯絡資訊管理</h1>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    let associations = [];
    let editing = null;

    async function reload() {
      associations = await getAll("associations");
      render();
    }

    function newAssociation() {
      editing = { township: "", name: "", phone: "", address: "" };
      render();
    }

    function editAssociation(id) {
      editing = JSON.parse(JSON.stringify(associations.find((a) => a.id === id)));
      render();
    }

    async function deleteAssociation(id) {
      const association = associations.find((a) => a.id === id);
      const confirmed = await showConfirmDialog(`確定要刪除「${association.name}」嗎？`, { confirmLabel: "刪除", danger: true });
      if (!confirmed) return;
      await deleteItem("associations", id);
      await reload();
    }

    async function saveAssociation(e) {
      e.preventDefault();
      editing.township = document.getElementById("f-township").value;
      editing.name = document.getElementById("f-name").value;
      editing.phone = document.getElementById("f-phone").value;
      editing.address = document.getElementById("f-address").value;

      if (editing.id) {
        await setItem("associations", editing.id, editing);
      } else {
        await addItem("associations", editing);
      }
      editing = null;
      await reload();
    }

    function render() {
      document.getElementById("content").innerHTML = `
        <button class="primary-button" onclick="newAssociation()" style="display: block; margin: 0.8rem 0 1.2rem;">+ 新增協會</button>
        <div class="table-scroll"><table class="admin-table">
          <thead><tr><th>名稱</th><th>鄉鎮</th><th></th></tr></thead>
          <tbody>
            ${associations.map((a) => `
              <tr>
                <td>${escapeHtml(a.name)}</td>
                <td>${townshipName(a.township)}</td>
                <td>
                  <button onclick="editAssociation('${a.id}')">編輯</button>
                  <button onclick="deleteAssociation('${a.id}')">刪除</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table></div>
      `;

      if (!editing) { renderEditModal(null); return; }

      renderEditModal(`
        <form class="member-form" id="association-form">
          <label>名稱 <input type="text" id="f-name" value="${escapeHtml(editing.name)}" required /></label>
          <label>鄉鎮
            <select id="f-township">
              <option value="">請選擇</option>
              ${TOWNSHIPS.map((t) => `<option value="${t.id}" ${editing.township === t.id ? "selected" : ""}>${t.name}</option>`).join("")}
            </select>
          </label>
          <label>電話 <input type="text" id="f-phone" value="${escapeHtml(editing.phone)}" /></label>
          <label>地址 <input type="text" id="f-address" value="${escapeHtml(editing.address)}" /></label>
          <button type="submit" class="primary-button">儲存</button>
          <button type="button" class="secondary-button" onclick="editing = null; render();">取消</button>
        </form>
      `, () => { editing = null; render(); });

      document.getElementById("association-form").addEventListener("submit", saveAssociation);
    }

    requireAdmin(() => reload());
  </script>
</body>
</html>
