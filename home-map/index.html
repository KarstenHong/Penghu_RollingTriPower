<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首頁</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/css/animated.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/animate.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>首頁</h1>

    <div class="font-size-controls">
      <span>字體大小：</span>
      <button onclick="setFontSize('')">標準</button>
      <button onclick="setFontSize('text-large')">大</button>
      <button onclick="setFontSize('text-xlarge')">特大</button>
    </div>

    <p class="hint-text">歡迎來到「澎湖縣滾動三力學運動地圖資訊平台」，點選下面的項目看更多內容。</p>

    <div class="directory-grid" id="directory-grid"></div>
  </main>

  <script>
    // 每個項目對應一個頁籤頁面，卡片內容固定用這份簡短說明，不再另外抓資料庫資料做預覽
    // （之前最新消息／成果與資源兩張卡片會多讀一次 posts／gallery 來加預覽內容，客戶覺得不需要，
    // 拿掉後首頁只需要畫這 8 張固定卡片，不必再等或再讀第二次資料）
    // 順序跟導覽列（common.js 的 NAV_LINKS）一致
    const DIRECTORY_ITEMS = [
      { icon: "📰", title: "最新消息", href: "/posts/?category=news", teaser: "掌握最新消息與活動資訊。" },
      { icon: "📖", title: "認識滾動三力學", href: "/about-program/", teaser: "了解「動身體、想策略、交朋友」滾動三力學運動的理念與方法。" },
      { icon: "📈", title: "課程效益", href: "/course-benefits/", teaser: "認識參加滾動三力學運動課程為學員健康帶來的效益。" },
      { icon: "🗺️", title: "滾動三力學運動地圖", href: "/sports-map/", teaser: "透過互動地圖尋找鄰近的課程據點，查看上課時間與招生狀態。" },
      { icon: "📝", title: "參與課程", href: "/join-course/", teaser: "搜尋課程據點，查看上課時間、招生狀態與聯絡方式。" },
      { icon: "🤝", title: "加入指導團隊", href: "/join-team/", teaser: "歡迎有興趣的夥伴加入指導團隊，一起帶領社區學員動起來。" },
      { icon: "🏆", title: "成果與資源／聯絡我們", href: "/results-contact/", teaser: "瀏覽學員參與課程的精彩紀錄，或查詢各社區協會聯絡方式。" },
      { icon: "ℹ️", title: "關於我們／方案評估平台", href: "/about-evaluation/", teaser: "認識我們的團隊與方案評估平台。" },
    ];

    function directoryCardHtml(item) {
      return `
        <a class="directory-card" href="${item.href}">
          <span class="directory-icon">${item.icon}</span>
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.teaser)}</p>
          <span class="directory-more">更多內容 →</span>
        </a>
      `;
    }

    function render() {
      const grid = document.getElementById("directory-grid");
      grid.innerHTML = DIRECTORY_ITEMS.map(directoryCardHtml).join("");
    }

    render();
  </script>
</body>
</html>
