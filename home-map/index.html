<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首頁 - 澎湖縣滾動三力學運動地圖資訊平台</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>首頁</h1>

    <div class="font-size-controls">
      <span>字體大小：</span>
      <button onclick="setFontSize('')">標準</button>
      <button onclick="setFontSize('text-large')">大</button>
      <button onclick="setFontSize('text-xlarge')">特大</button>
    </div>

    <p class="hint-text">歡迎來到「澎湖縣滾動三力學運動地圖資訊平台」，點選下面的項目看更多內容。</p>

    <div class="directory-grid" id="directory-grid"></div>
  </main>

  <script>
    // 每個項目對應一個頁籤頁面；最新消息、成果與資源這兩個有實際資料庫內容，
    // 抓最新的幾筆當預覽，其餘還沒有內容的頁面先放固定的簡短說明
    const DIRECTORY_ITEMS = [
      { icon: "📖", title: "認識滾動三力學", href: "/about-program/", teaser: "了解「動身體、想策略、交朋友」滾動三力學運動的理念與方法。" },
      { icon: "📈", title: "課程效益", href: "/course-benefits/", teaser: "認識參加滾動三力學運動課程為學員健康帶來的效益。" },
      { icon: "🗺️", title: "滾動三力學運動地圖", href: "/sports-map/", teaser: "透過互動地圖尋找鄰近的課程據點，查看上課時間與招生狀態。" },
      { icon: "📝", title: "參與課程", href: "/join-course/", teaser: "搜尋課程據點，查看上課時間、招生狀態與聯絡方式。" },
      { icon: "🤝", title: "加入指導團隊", href: "/join-team/", teaser: "歡迎有興趣的夥伴加入指導團隊，一起帶領社區學員動起來。" },
      { icon: "📰", title: "最新消息", href: "/posts/?category=news", teaser: "掌握最新消息與活動資訊。" },
      { icon: "🏆", title: "成果與資源／聯絡我們", href: "/results-contact/", teaser: "瀏覽學員參與課程的精彩紀錄，或查詢各社區協會聯絡方式。" },
      { icon: "ℹ️", title: "關於我們／方案評估平台", href: "/about-evaluation/", teaser: "認識我們的團隊與方案評估平台。" },
    ];

    function directoryCardHtml(item, extraHtml) {
      return `
        <a class="directory-card" href="${item.href}">
          <span class="directory-icon">${item.icon}</span>
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.teaser)}</p>
          ${extraHtml || ""}
          <span class="directory-more">更多內容 →</span>
        </a>
      `;
    }

    async function init() {
      const [posts, photos] = await Promise.all([getAll("posts"), getAll("gallery")]);
      posts.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      photos.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

      const grid = document.getElementById("directory-grid");
      grid.innerHTML = DIRECTORY_ITEMS.map((item) => {
        if (item.title === "最新消息" && posts.length) {
          const list = posts.slice(0, 2).map((p) => `<p class="directory-preview-line">・${escapeHtml(p.title)}</p>`).join("");
          return directoryCardHtml(item, list);
        }
        if (item.title === "成果與資源／聯絡我們" && photos.length) {
          const thumbs = `<div class="directory-thumbs">${photos.slice(0, 3).map((p) => `<img src="${escapeHtml(p.imageUrl)}" alt="" loading="lazy" />`).join("")}</div>`;
          return directoryCardHtml(item, thumbs);
        }
        return directoryCardHtml(item);
      }).join("");
    }

    init();
  </script>
</body>
</html>
