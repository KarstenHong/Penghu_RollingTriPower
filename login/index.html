<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理者登入</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main class="centered-form-page">
    <h1>管理者登入</h1>

    <form class="member-form" id="login-form">
      <label>電子郵件 <input type="email" id="email" required /></label>
      <label>密碼 <input type="password" id="password" required /></label>
      <button type="submit" class="primary-button">登入</button>
    </form>

    <p class="error-text" id="error" style="display: none;">登入失敗，請確認帳號密碼是否正確。</p>
    <p>忘記密碼了嗎？<a href="/forgot-password/">點此重設密碼</a></p>
  </main>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("error").style.display = "none";
      try {
        await loginUser(document.getElementById("email").value, document.getElementById("password").value);
        location.href = "/admin/";
      } catch (err) {
        document.getElementById("error").style.display = "block";
      }
    });
  </script>
</body>
</html>
