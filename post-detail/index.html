<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公告</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    async function init() {
      const id = new URLSearchParams(location.search).get("id");
      const post = id ? await getById("posts", id) : null;
      const el = document.getElementById("content");

      if (!post) {
        el.innerHTML = '<p class="hint-text">找不到這則公告。</p>';
        return;
      }

      document.title = post.title + " - " + SITE_NAME;
      el.innerHTML = `
        <a href="/posts/?category=${escapeHtml(post.category)}" class="back-button">&larr; 返回列表</a>
        <h1>${escapeHtml(post.title)}</h1>
        <p class="post-date">${escapeHtml(post.date)}</p>
        ${post.imageUrl ? `<img class="post-detail-image" src="${escapeHtml(post.imageUrl)}" alt="" />` : ""}
        <p class="post-content">${escapeHtml(post.content)}</p>
      `;
    }

    init();
  </script>
</body>
</html>
