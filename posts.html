<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>最新消息 - 澎湖縣三力運動地圖</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1 id="title"></h1>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    const category = new URLSearchParams(location.search).get("category") || "news";
    document.getElementById("title").textContent = category === "event" ? "活動資訊" : "最新消息";
    document.title = document.getElementById("title").textContent + " - 澎湖縣三力運動地圖";

    async function init() {
      const posts = await getWhere("posts", "category", category);
      posts.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

      const el = document.getElementById("content");
      if (!posts.length) {
        el.innerHTML = `<p class="hint-text">目前沒有${document.getElementById("title").textContent}。</p>`;
        return;
      }

      el.innerHTML = '<div class="post-list">' + posts.map((p) => `
        <a class="post-card" href="post-detail.html?id=${encodeURIComponent(p.id)}">
          ${p.imageUrl ? `<img src="${escapeHtml(p.imageUrl)}" alt="" />` : ""}
          <div>
            <h3>${escapeHtml(p.title)}</h3>
            <p class="post-date">${escapeHtml(p.date)}</p>
          </div>
        </a>
      `).join("") + "</div>";
    }

    init();
  </script>
</body>
</html>
