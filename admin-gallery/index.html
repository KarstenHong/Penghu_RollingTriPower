<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成果集管理</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <a href="/admin/" class="back-button">&larr; 返回後台首頁</a>
    <h1>成果集管理</h1>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    let albums = [];
    let photos = [];
    let currentAlbumId = null;
    let editingAlbum = null;
    let editingPhoto = null;

    async function reload() {
      [albums, photos] = await Promise.all([getAll("albums"), getAll("gallery")]);
      if (currentAlbumId && !albums.some((a) => a.id === currentAlbumId)) currentAlbumId = null;
      render();
    }

    function photoCount(albumId) {
      return photos.filter((p) => p.albumId === albumId).length;
    }

    // ---- 相簿 ----

    function newAlbum() {
      editingAlbum = { name: "" };
      render();
    }

    async function saveAlbum(e) {
      e.preventDefault();
      const name = document.getElementById("f-album-name").value.trim();
      if (!name) return;
      await addItem("albums", { name });
      editingAlbum = null;
      await reload();
      showToast("已儲存");
    }

    async function deleteAlbum(id) {
      const album = albums.find((a) => a.id === id);
      const count = photoCount(id);
      const confirmed = await showConfirmDialog(
        count
          ? `刪除相簿「${album.name}」會一併刪除其中 ${count} 張照片，確定要刪除嗎？`
          : `確定要刪除相簿「${album.name}」嗎？`,
        { confirmLabel: "刪除", danger: true },
      );
      if (!confirmed) return;

      const toDelete = photos.filter((p) => p.albumId === id);
      for (const p of toDelete) await deleteItem("gallery", p.id);
      await deleteItem("albums", id);
      if (currentAlbumId === id) currentAlbumId = null;
      await reload();
    }

    // ---- 照片 ----

    function newPhoto() {
      editingPhoto = { caption: "", date: new Date().toISOString().slice(0, 10) };
      render();
    }

    function editPhoto(id) {
      editingPhoto = JSON.parse(JSON.stringify(photos.find((p) => p.id === id)));
      render();
    }

    async function deletePhoto(id) {
      const confirmed = await showConfirmDialog("確定要刪除這張照片嗎？", { confirmLabel: "刪除", danger: true });
      if (!confirmed) return;
      await deleteItem("gallery", id);
      await reload();
    }

    // 編輯既有照片時只換一張圖；新增時可以一次選多個檔案，逐張壓縮後各自存成一筆，
    // 說明／日期是共用同一份輸入值（批次上傳同一天的活動照片最常見的用法），事後要改個別說明再進編輯
    async function savePhoto(e) {
      e.preventDefault();
      const form = e.target;
      const files = [...document.getElementById("f-photo-file").files];
      const caption = document.getElementById("f-caption").value;
      const date = document.getElementById("f-date").value;
      const saveBtn = form.querySelector('button[type="submit"]');

      if (!files.length && !editingPhoto.imageUrl) {
        alert("請選擇照片檔案");
        return;
      }

      saveBtn.disabled = true;
      try {
        if (editingPhoto.id) {
          saveBtn.textContent = "處理中...";
          let imageUrl = editingPhoto.imageUrl;
          if (files[0]) {
            try {
              imageUrl = await fileToCompressedDataUrl(files[0]);
            } catch (err) {
              alert(`「${files[0].name}」處理失敗：${err.message}`);
              return;
            }
            if (imageUrl.length > 1000000) {
              alert("這張照片壓縮後還是太大，請換一張較小的照片再試一次");
              return;
            }
          }
          await setItem("gallery", editingPhoto.id, { albumId: currentAlbumId, imageUrl, caption, date });
        } else {
          // 逐張處理，單張失敗（例如格式不支援）只跳過那一張、繼續處理其他張，不會讓整批上傳中斷
          const failed = [];
          for (let i = 0; i < files.length; i++) {
            saveBtn.textContent = `處理中...（${i + 1}/${files.length}）`;
            let imageUrl;
            try {
              imageUrl = await fileToCompressedDataUrl(files[i]);
            } catch (err) {
              failed.push(`${files[i].name}：${err.message}`);
              continue;
            }
            if (imageUrl.length > 1000000) {
              failed.push(`${files[i].name}：壓縮後還是太大`);
              continue;
            }
            await addItem("gallery", { albumId: currentAlbumId, imageUrl, caption, date });
          }
          if (failed.length) alert(`以下照片已略過：\n${failed.join("\n")}`);
        }
        editingPhoto = null;
        await reload();
        showToast("已儲存");
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "儲存";
      }
    }

    // ---- 畫面 ----

    function render() {
      renderAlbumList();
      renderPhotoSection();
      renderModals();
    }

    function renderAlbumList() {
      document.getElementById("content").innerHTML = `
        <button class="primary-button" onclick="newAlbum()" style="display: block; margin: 0.8rem 0 1.2rem;">+ 新增相簿</button>
        <div class="table-scroll"><table class="admin-table">
          <thead><tr><th>相簿名稱</th><th>照片數</th><th></th></tr></thead>
          <tbody>
            ${albums.map((a) => `
              <tr${a.id === currentAlbumId ? ' style="background:#eaf6f8;"' : ""}>
                <td>${escapeHtml(a.name)}</td>
                <td>${photoCount(a.id)}</td>
                <td>
                  <button onclick="currentAlbumId='${a.id}'; render();">管理照片</button>
                  <button onclick="deleteAlbum('${a.id}')">刪除</button>
                </td>
              </tr>
            `).join("") || `<tr><td colspan="3">還沒有相簿，請先新增一個。</td></tr>`}
          </tbody>
        </table></div>
        <div id="photo-section"></div>
      `;
    }

    function renderPhotoSection() {
      const el = document.getElementById("photo-section");
      if (!currentAlbumId) return;
      const album = albums.find((a) => a.id === currentAlbumId);
      const list = photos.filter((p) => p.albumId === currentAlbumId);

      el.innerHTML = `
        <h2 style="margin-top: 2rem;">${escapeHtml(album.name)} 的照片</h2>
        <button class="primary-button" onclick="newPhoto()" style="display: block; margin: 0.8rem 0 1.2rem;">+ 新增照片</button>
        <div class="table-scroll"><table class="admin-table">
          <thead><tr><th>照片</th><th>說明</th><th>日期</th><th></th></tr></thead>
          <tbody>
            ${list.map((p) => `
              <tr>
                <td>${p.imageUrl ? `<img src="${escapeHtml(p.imageUrl)}" alt="" style="width:60px;height:60px;object-fit:cover;border-radius:8px;" />` : ""}</td>
                <td>${escapeHtml(p.caption)}</td>
                <td>${escapeHtml(p.date)}</td>
                <td>
                  <button onclick="editPhoto('${p.id}')">編輯</button>
                  <button onclick="deletePhoto('${p.id}')">刪除</button>
                </td>
              </tr>
            `).join("") || `<tr><td colspan="4">這個相簿還沒有照片。</td></tr>`}
          </tbody>
        </table></div>
      `;
    }

    function renderModals() {
      if (editingAlbum) {
        renderEditModal(`
          <form class="member-form" id="album-form">
            <label>相簿名稱 <input type="text" id="f-album-name" value="${escapeHtml(editingAlbum.name)}" required /></label>
            <button type="submit" class="primary-button">儲存</button>
            <button type="button" class="secondary-button" onclick="editingAlbum = null; render();">取消</button>
          </form>
        `);
        document.getElementById("album-form").addEventListener("submit", saveAlbum);
        return;
      }

      if (editingPhoto) {
        renderEditModal(`
          <form class="member-form" id="photo-form">
            <label>照片檔案 ${editingPhoto.id ? "（不選則保留原照片）" : "（可一次選多張）"}
              <input type="file" id="f-photo-file" accept="image/*" ${editingPhoto.id ? "" : "multiple required"} />
            </label>
            ${editingPhoto.imageUrl ? `<img src="${escapeHtml(editingPhoto.imageUrl)}" alt="" style="width:100px;height:100px;object-fit:cover;border-radius:8px;" />` : ""}
            <label>說明${editingPhoto.id ? "（選填）" : "（選填，多張照片會共用同一份說明）"} <input type="text" id="f-caption" value="${escapeHtml(editingPhoto.caption)}" /></label>
            <label>日期 <input type="date" id="f-date" value="${escapeHtml(editingPhoto.date)}" /></label>
            <button type="submit" class="primary-button">儲存</button>
            <button type="button" class="secondary-button" onclick="editingPhoto = null; render();">取消</button>
          </form>
        `);
        document.getElementById("photo-form").addEventListener("submit", savePhoto);
        return;
      }

      renderEditModal(null);
    }

    requireAdmin(() => reload());
  </script>
</body>
</html>
