<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>澎湖縣社區運動資源查詢</title>
    <script type="text/javascript">
        // GitHub Pages 是靜態主機，沒有伺服器端路由改寫；
        // 這裡把實際路徑塞進查詢字串導回 index.html，讓 Blazor Router 接手還原路徑。
        // 做法參考 https://github.com/rafgraph/spa-github-pages
        var pathSegmentsToKeep = 1; // 對應 /penghu-sports-finder/ 這一層

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
