<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>滾動三力學運動地圖 - 澎湖縣滾動三力學運動地圖資訊平台</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/map-data.js"></script>
</head>
<body class="sports-map-page">
  <div id="nav"></div>
  <main>
    <h1>滾動三力學運動地圖</h1>
    <p class="hint-text">點選下面的鄉鎮名稱，或直接點地圖上的鄉鎮，即可查看該地區的課程據點、上課時間與招生狀態</p>

    <div class="township-buttons" id="township-buttons"></div>

    <div class="map-container">
      <div class="map-wrap" id="map"></div>
      <div class="map-insets">
        <div class="map-inset" id="inset-wangan"></div>
        <div class="map-inset" id="inset-qimei"></div>
      </div>
    </div>
    <p class="hint-text inset-note">望安、七美離本島較遠，用縮圖顯示在左上角方便點選，位置非實際方位</p>
  </main>

  <script>
    renderPenghuMap("map", ["magong", "huxi", "baisha", "xiyu"]);
    renderMapInset("inset-wangan", "wangan");
    renderMapInset("inset-qimei", "qimei");

    document.getElementById("township-buttons").innerHTML = TOWNSHIPS.map((t) => `
      <a class="township-button" data-township="${t.id}" href="/township/?id=${t.id}" style="--tb-color: ${TOWNSHIP_COLORS[t.id]}">${t.name}</a>
    `).join("");
    wireTownshipButtonHover();
  </script>
</body>
</html>
