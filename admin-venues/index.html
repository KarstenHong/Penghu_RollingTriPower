<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>場域管理</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/map-data.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <a href="/admin/" class="back-button">&larr; 返回後台首頁</a>
    <h1>場域管理</h1>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    let venues = [];
    let editing = null;

    async function reload() {
      venues = await getAll("venues");
      render();
    }

    function newVenue() {
      editing = { name: "", township: "", type: "", address: "", phone: "", sportTypes: [], lat: "", lng: "", photoUrl: "", markerOffsetX: null, markerOffsetY: null };
      render();
    }

    function editVenue(id) {
      const v = venues.find((x) => x.id === id);
      editing = JSON.parse(JSON.stringify(v));
      // JSON.stringify 會把 undefined 的欄位整個拿掉，舊資料（還沒用過地圖微調工具）在這裡補回
      // null，不要留 undefined——Firestore 存檔時遇到 undefined 值會直接丟例外，null 才是安全值
      editing.markerOffsetX = editing.markerOffsetX ?? null;
      editing.markerOffsetY = editing.markerOffsetY ?? null;
      render();
    }

    async function deleteVenue(id) {
      const venue = venues.find((v) => v.id === id);
      const confirmed = await showConfirmDialog(`確定要刪除「${venue.name}」嗎？`, { confirmLabel: "刪除", danger: true });
      if (!confirmed) return;
      await deleteItem("venues", id);
      await reload();
    }

    async function saveVenue(e) {
      e.preventDefault();
      const saveBtn = e.target.querySelector('button[type="submit"]');
      const file = document.getElementById("f-photo-file").files[0];

      editing.name = document.getElementById("f-name").value;
      editing.township = document.getElementById("f-township").value;
      editing.type = document.getElementById("f-type").value;
      editing.address = document.getElementById("f-address").value;
      editing.phone = document.getElementById("f-phone").value;
      editing.lat = parseFloat(document.getElementById("f-lat").value) || null;
      editing.lng = parseFloat(document.getElementById("f-lng").value) || null;
      editing.sportTypes = Array.from(document.querySelectorAll(".f-sport:checked")).map((c) => c.value);

      // 上傳檔案的話優先用檔案（存進 Firestore、不會像 Google 雲端硬碟連結那樣偶爾失效），
      // 沒選檔案才照原本的方式用「照片網址」欄位（給已經有穩定外部圖床網址的情況用）
      if (file) {
        saveBtn.disabled = true;
        saveBtn.textContent = "處理中...";
        try {
          editing.photoUrl = await fileToCompressedDataUrl(file);
        } catch (err) {
          alert(`「${file.name}」處理失敗：${err.message}`);
          saveBtn.disabled = false;
          saveBtn.textContent = "儲存";
          return;
        }
      } else {
        // 網址欄位空白時不動 editing.photoUrl：已經上傳過照片的話，畫面上這欄位是刻意留空的
        // （見下面 photoUrlFieldValue 的說明），空白不代表要清掉現有照片
        const urlValue = document.getElementById("f-photo").value.trim();
        if (urlValue) editing.photoUrl = normalizeImageUrl(urlValue);
      }

      if (editing.id) {
        await setItem("venues", editing.id, editing);
      } else {
        await addItem("venues", editing);
      }
      editing = null;
      await reload();
      showToast("已儲存");
    }

    function render() {
      document.getElementById("content").innerHTML = `
        <button class="primary-button" onclick="newVenue()" style="display: block; margin: 0.8rem 0 1.2rem;">+ 新增場域</button>
        <div class="table-scroll"><table class="admin-table">
          <thead><tr><th>照片</th><th>名稱</th><th>鄉鎮</th><th>類型</th><th></th></tr></thead>
          <tbody>
            ${venues.map((v) => `
              <tr>
                <td>${v.photoUrl ? `<img src="${escapeHtml(v.photoUrl)}" alt="" style="width:60px;height:60px;object-fit:cover;border-radius:8px;" />` : ""}</td>
                <td>${escapeHtml(v.name)}</td>
                <td>${townshipName(v.township)}</td>
                <td>${venueTypeName(v.type)}</td>
                <td>
                  <button onclick="editVenue('${v.id}')">編輯</button>
                  <button onclick="deleteVenue('${v.id}')">刪除</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table></div>
      `;

      if (!editing) { renderEditModal(null); return; }

      // 上傳過的照片網址欄位存的是很長的 Base64 字串，不適合整串塞進文字輸入框讓人誤改，
      // 顯示成空白就好，靠上面的縮圖預覽提示「已經有照片了」
      const photoUrlFieldValue = (editing.photoUrl || "").startsWith("data:") ? "" : editing.photoUrl;

      renderEditModal(`
        <form class="member-form" id="venue-form">
          <label>名稱 <input type="text" id="f-name" value="${escapeHtml(editing.name)}" required /></label>
          <label>鄉鎮
            <select id="f-township" onchange="renderMarkerPreview()">
              <option value="">請選擇</option>
              ${TOWNSHIPS.map((t) => `<option value="${t.id}" ${editing.township === t.id ? "selected" : ""}>${t.name}</option>`).join("")}
            </select>
          </label>
          <label>類型
            <select id="f-type">
              <option value="">請選擇</option>
              ${VENUE_TYPES.map((t) => `<option value="${t.id}" ${editing.type === t.id ? "selected" : ""}>${t.name}</option>`).join("")}
            </select>
          </label>
          <label>地址 <input type="text" id="f-address" value="${escapeHtml(editing.address)}" /></label>
          <label>電話 <input type="text" id="f-phone" value="${escapeHtml(editing.phone)}" /></label>
          <label>上傳照片（選填，會取代下面的照片網址） <input type="file" id="f-photo-file" accept="image/*" /></label>
          ${editing.photoUrl ? `<img src="${escapeHtml(editing.photoUrl)}" alt="" style="width:100px;height:100px;object-fit:cover;border-radius:8px;" />` : ""}
          <label>照片網址（選填，貼 Google 雲端硬碟共用連結也可以，但不如上傳穩定） <input type="text" id="f-photo" value="${escapeHtml(photoUrlFieldValue)}" /></label>
          <label>緯度 Latitude（用於在鄉鎮地圖上標示位置，可到 Google 地圖上按右鍵複製座標）
            <input type="number" step="any" id="f-lat" value="${editing.lat ?? ""}" placeholder="例如 23.5654" oninput="renderMarkerPreview()" />
          </label>
          <label>經度 Longitude
            <input type="number" step="any" id="f-lng" value="${editing.lng ?? ""}" placeholder="例如 119.5654" oninput="renderMarkerPreview()" />
          </label>
          <div id="marker-preview-section"></div>
          <fieldset>
            <legend>提供的運動項目</legend>
            ${activeSportTypes(editing.sportTypes || []).map((s) => `
              <label class="checkbox-line">
                <input type="checkbox" class="f-sport" value="${s.id}" ${(editing.sportTypes || []).includes(s.id) ? "checked" : ""} />
                ${s.name}
              </label>
            `).join("")}
          </fieldset>
          <button type="submit" class="primary-button">儲存</button>
          <button type="button" class="secondary-button" onclick="editing = null; render();">取消</button>
        </form>
      `);

      document.getElementById("venue-form").addEventListener("submit", saveVenue);
      renderMarkerPreview();
    }

    // 地圖位置微調：讓後台可以直接看到、調整圖示在地圖上的實際位置，不用再麻煩工程師改程式碼。
    // 只更新 #marker-preview-section 這個小區塊，不會動到表單其他欄位（不會像整個 renderEditModal()
    // 重建那樣讓輸入到一半的欄位、動畫都重播一次）
    function renderMarkerPreview() {
      const section = document.getElementById("marker-preview-section");
      if (!section) return;

      const township = document.getElementById("f-township").value;
      const lat = parseFloat(document.getElementById("f-lat").value);
      const lng = parseFloat(document.getElementById("f-lng").value);

      if (!township || isNaN(lat) || isNaN(lng)) {
        section.innerHTML = `<p class="hint-text">請先填寫鄉鎮與經緯度，這裡會顯示地圖預覽，可以直接點擊調整圖示位置。</p>`;
        return;
      }

      const previewVenue = { id: editing.id, lat, lng, markerOffsetX: editing.markerOffsetX, markerOffsetY: editing.markerOffsetY };
      const [mx, my] = projectVenueMarker(previewVenue);
      const offsetX = editing.markerOffsetX ?? 0;
      const offsetY = editing.markerOffsetY ?? 0;

      section.innerHTML = `
        <label>地圖位置微調（選填）</label>
        <p class="hint-text">如果圖示位置跟實際地點不符，可以直接點擊地圖上正確的位置，或用下面的按鈕微調，儲存後立即生效。</p>
        <div class="map-wrap" style="max-width: 260px; padding: 0.6rem;">
          <div id="marker-preview-map"></div>
        </div>
        <p class="hint-text">目前偏移量：X=${offsetX}, Y=${offsetY}</p>
        <div style="display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 4px; margin: 0.6rem 0;">
          <span></span><button type="button" onclick="nudgeMarker(0, -1)">&uarr;</button><span></span>
          <button type="button" onclick="nudgeMarker(-1, 0)">&larr;</button><span></span><button type="button" onclick="nudgeMarker(1, 0)">&rarr;</button>
          <span></span><button type="button" onclick="nudgeMarker(0, 1)">&darr;</button><span></span>
        </div>
        <button type="button" class="secondary-button" onclick="resetMarkerOffset()" style="display: block;">重設為原始座標位置</button>
      `;

      renderTownshipMap("marker-preview-map", township);
      const svg = document.querySelector("#marker-preview-map svg");
      if (!svg) return;

      svg.style.maxWidth = "100%";
      svg.insertAdjacentHTML("beforeend", `
        <circle cx="${mx}" cy="${my}" r="6" fill="white" stroke="rgba(0,0,0,0.3)" stroke-width="1" />
        <circle cx="${mx}" cy="${my}" r="3.5" fill="#e76f51" />
      `);
      svg.style.cursor = "crosshair";
      svg.addEventListener("click", (e) => {
        const pt = svg.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        const svgPt = pt.matrixTransform(svg.getScreenCTM().inverse());
        const [rawX, rawY] = projectLatLng(lat, lng);
        editing.markerOffsetX = Math.round(svgPt.x - rawX);
        editing.markerOffsetY = Math.round(svgPt.y - rawY);
        renderMarkerPreview();
      });
    }

    function nudgeMarker(dx, dy) {
      editing.markerOffsetX = (editing.markerOffsetX ?? 0) + dx;
      editing.markerOffsetY = (editing.markerOffsetY ?? 0) + dy;
      renderMarkerPreview();
    }

    function resetMarkerOffset() {
      editing.markerOffsetX = 0;
      editing.markerOffsetY = 0;
      renderMarkerPreview();
    }

    requireAdmin(async () => {
      await loadSportTypes();
      await reload();
    });
  </script>
</body>
</html>
