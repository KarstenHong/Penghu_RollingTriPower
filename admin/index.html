<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台維護</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>後台維護</h1>
    <ul class="admin-nav">
      <li><a href="/admin-venues/">場域管理（活動中心／協會／衛生所）</a></li>
      <li><a href="/admin-courses/">運動課程管理</a></li>
      <li><a href="/admin-posts/">最新消息／活動資訊管理</a></li>
      <li><a href="/admin-faq/">常見問題管理</a></li>
      <li><a href="/admin-associations/">社區協會聯絡資訊管理</a></li>
      <li><a href="/admin-gallery/">活動成果集管理</a></li>
      <li><a href="/admin-sporttypes/">運動項目管理</a></li>
      <li><a href="/admin-activitytypes/">活動類型管理</a></li>
      <li><a href="/admin-users/">管理者帳號管理</a></li>
      <li><a href="/admin-help/">後台操作說明</a></li>
    </ul>

    <h2 style="margin-top: 2.5rem;">資料快取</h2>
    <p class="hint-text">
      場域、課程、公告、常見問題、社區協會、運動項目、活動類型、相簿這幾類資料，訪客瀏覽器會暫存一份，不用每次都重新讀一次資料庫。
      新增/編輯/刪除後會自動讓暫存失效，訪客下次瀏覽就會拿到最新資料；如果想立刻讓所有訪客重新讀取（不用等他們自己下次操作觸發），可以按這個按鈕。
    </p>
    <button class="secondary-button" id="reset-cache-btn" style="display: block;">重置訪客資料快取</button>
  </main>

  <script>
    document.getElementById("reset-cache-btn").addEventListener("click", async () => {
      const confirmed = await showConfirmDialog("確定要重置訪客的資料快取嗎？", { confirmLabel: "重置" });
      if (!confirmed) return;
      await bumpCacheVersion();
      showToast("已重置");
    });

    requireAdmin(() => {});
  </script>
</body>
</html>
