<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台維護</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>後台維護</h1>
    <p class="hint-text">選擇要維護的項目，點卡片進入該管理頁面。</p>

    <div class="directory-grid" id="admin-grid"></div>

    <h2 style="margin-top: 2.5rem;">其他</h2>
    <ul class="admin-nav">
      <li><a href="/admin-help/">💡 後台操作說明</a></li>
    </ul>

    <h2 style="margin-top: 2.5rem;">資料快取</h2>
    <p class="hint-text">
      場域、課程、公告、社區協會、運動項目、活動類型、相簿這幾類資料，訪客瀏覽器會暫存一份，不用每次都重新讀一次資料庫。
      新增/編輯/刪除後會自動讓暫存失效，訪客下次瀏覽就會拿到最新資料；如果想立刻讓所有訪客重新讀取（不用等他們自己下次操作觸發），可以按這個按鈕。
    </p>
    <button class="secondary-button" id="reset-cache-btn" style="display: block;">重置訪客資料快取</button>
  </main>

  <script>
    // 卡片樣式跟首頁的分類卡（.directory-grid／.directory-card）共用同一套 CSS，
    // 維護入口跟訪客首頁看起來是同一家的介面，不用另外寫一套卡片樣式
    const ADMIN_ITEMS = [
      { icon: "📍", title: "場域管理", href: "/admin-venues/", teaser: "新增、編輯活動中心／協會／衛生所等據點的基本資料與地圖位置。" },
      { icon: "🏃", title: "運動課程管理", href: "/admin-courses/", teaser: "設定各據點開的課程：運動類型、活動類型、上課時間與招生狀態。" },
      { icon: "📰", title: "最新消息／活動資訊管理", href: "/admin-posts/", teaser: "發布最新消息與活動公告，前台首頁與消息列表會同步顯示。" },
      { icon: "☎️", title: "社區協會聯絡資訊管理", href: "/admin-associations/", teaser: "維護各社區協會的聯絡窗口、電話等資訊。" },
      { icon: "📷", title: "活動成果集管理", href: "/admin-gallery/", teaser: "上傳、整理活動照片，呈現在成果相簿頁面。" },
      { icon: "🏸", title: "運動項目管理", href: "/admin-sporttypes/", teaser: "新增運動項目與圖示，給場域、課程選用，也是地圖圖釘的依據。" },
      { icon: "🏷️", title: "活動類型管理", href: "/admin-activitytypes/", teaser: "設定課程的活動類型分類與代表色，套用在課程資料上。" },
      { icon: "👤", title: "管理者帳號管理", href: "/admin-users/", teaser: "新增或移除其他管理者的後台登入權限。" },
    ];

    document.getElementById("admin-grid").innerHTML = ADMIN_ITEMS.map((item) => `
      <a class="directory-card" href="${item.href}">
        <span class="directory-icon">${item.icon}</span>
        <h3>${escapeHtml(item.title)}</h3>
        <p>${escapeHtml(item.teaser)}</p>
        <span class="directory-more">前往管理 →</span>
      </a>
    `).join("");

    document.getElementById("reset-cache-btn").addEventListener("click", async () => {
      const confirmed = await showConfirmDialog("確定要重置訪客的資料快取嗎？", { confirmLabel: "重置" });
      if (!confirmed) return;
      await bumpCacheVersion();
      showToast("已重置");
    });

    requireAdmin(() => {});
  </script>
</body>
</html>
