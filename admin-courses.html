<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>運動課程管理 - 澎湖縣社區運動資源查詢</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <a href="admin.html" class="back-button">&larr; 返回後台首頁</a>
    <h1>運動課程管理</h1>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    let courses = [];
    let venues = [];
    let editing = null;

    function venueName(id) {
      return venues.find((v) => v.id === id)?.name || id;
    }

    async function reload() {
      courses = await getAll("courses");
      render();
    }

    function newCourse() {
      editing = {
        venueId: "", sportType: "", schedule: "", description: "",
        status: "enrolling", startDate: "", endDate: "", targetAudience: "",
        instructorTeam: "", fee: "", registrationMethod: "", accessibilityInfo: "", otherNotes: "",
      };
      render();
    }

    function editCourse(id) {
      editing = JSON.parse(JSON.stringify(courses.find((c) => c.id === id)));
      render();
    }

    async function deleteCourse(id) {
      await deleteItem("courses", id);
      await reload();
    }

    async function saveCourse(e) {
      e.preventDefault();
      editing.venueId = document.getElementById("f-venue").value;
      editing.sportType = document.getElementById("f-sport").value;
      editing.schedule = document.getElementById("f-schedule").value;
      editing.description = document.getElementById("f-description").value;
      editing.status = document.getElementById("f-status").value;
      editing.startDate = document.getElementById("f-start-date").value;
      editing.endDate = document.getElementById("f-end-date").value;
      editing.targetAudience = document.getElementById("f-audience").value;
      editing.instructorTeam = document.getElementById("f-instructors").value;
      editing.fee = document.getElementById("f-fee").value;
      editing.registrationMethod = document.getElementById("f-registration").value;
      editing.accessibilityInfo = document.getElementById("f-accessibility").value;
      editing.otherNotes = document.getElementById("f-notes").value;
      editing.iconKey = editing.sportType;

      if (editing.id) {
        await setItem("courses", editing.id, editing);
      } else {
        await addItem("courses", editing);
      }
      editing = null;
      await reload();
    }

    function render() {
      let html = `
        <div class="table-scroll"><table class="admin-table">
          <thead><tr><th>場域</th><th>運動類型</th><th>時間</th><th>招生狀態</th><th></th></tr></thead>
          <tbody>
            ${courses.map((c) => `
              <tr>
                <td>${escapeHtml(venueName(c.venueId))}</td>
                <td>${sportName(c.sportType)}</td>
                <td>${escapeHtml(c.schedule)}</td>
                <td>${COURSE_STATUS[c.status] ? escapeHtml(COURSE_STATUS[c.status].label) : ""}</td>
                <td>
                  <button onclick="editCourse('${c.id}')">編輯</button>
                  <button onclick="deleteCourse('${c.id}')">刪除</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table></div>
        <button class="primary-button" onclick="newCourse()">+ 新增課程</button>
      `;

      if (editing) {
        html += `
          <form class="member-form" id="course-form">
            <label>場域
              <select id="f-venue">
                <option value="">請選擇</option>
                ${venues.map((v) => `<option value="${v.id}" ${editing.venueId === v.id ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}
              </select>
            </label>
            <label>運動類型
              <select id="f-sport">
                <option value="">請選擇</option>
                ${activeSportTypes([editing.sportType]).map((s) => `<option value="${s.id}" ${editing.sportType === s.id ? "selected" : ""}>${s.name}</option>`).join("")}
              </select>
            </label>
            <label>上課時間 <input type="text" id="f-schedule" value="${escapeHtml(editing.schedule)}" placeholder="例如：每週二、四 09:00-10:00" /></label>
            <label>說明 <textarea id="f-description">${escapeHtml(editing.description)}</textarea></label>
            <label>招生狀態
              <select id="f-status">
                ${Object.entries(COURSE_STATUS).map(([key, s]) => `<option value="${key}" ${editing.status === key ? "selected" : ""}>${s.icon} ${s.label}</option>`).join("")}
              </select>
            </label>
            <label>課程期間開始 <input type="date" id="f-start-date" value="${escapeHtml(editing.startDate || "")}" /></label>
            <label>課程期間結束 <input type="date" id="f-end-date" value="${escapeHtml(editing.endDate || "")}" /></label>
            <label>適合對象（選填） <input type="text" id="f-audience" value="${escapeHtml(editing.targetAudience || "")}" placeholder="例如：65歲以上社區長者" /></label>
            <label>指導團隊（選填） <input type="text" id="f-instructors" value="${escapeHtml(editing.instructorTeam || "")}" placeholder="例如：王老師、李協助員" /></label>
            <label>是否收費（選填） <input type="text" id="f-fee" value="${escapeHtml(editing.fee || "")}" placeholder="例如：免費" /></label>
            <label>報名方式（選填） <input type="text" id="f-registration" value="${escapeHtml(editing.registrationMethod || "")}" placeholder="例如：電話報名／線上報名" /></label>
            <label>無障礙資訊（選填） <input type="text" id="f-accessibility" value="${escapeHtml(editing.accessibilityInfo || "")}" placeholder="例如：輪椅可進入／設有無障礙廁所" /></label>
            <label>其他提醒（選填） <textarea id="f-notes">${escapeHtml(editing.otherNotes || "")}</textarea></label>
            <button type="submit" class="primary-button">儲存</button>
            <button type="button" class="secondary-button" onclick="editing = null; render();">取消</button>
          </form>
        `;
      }

      document.getElementById("content").innerHTML = html;
      if (editing) {
        document.getElementById("course-form").addEventListener("submit", saveCourse);
      }
    }

    requireAdmin(async () => {
      await loadSportTypes();
      venues = await getAll("venues");
      await reload();
    });
  </script>
</body>
</html>
