<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的最愛 - 澎湖縣社區運動資源查詢</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>我的最愛</h1>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    requireLogin(async (user) => {
      await loadSportTypes();
      const profile = (await getById("users", user.uid)) || { favoriteSports: [], favorites: [] };
      const favorites = profile.favorites || [];
      const [allVenues, allCourses] = await Promise.all([getAll("venues"), getAll("courses")]);

      let html = "<h2>喜愛的運動</h2>";
      if (!(profile.favoriteSports || []).length) {
        html += '<p class="hint-text">尚未選擇喜愛的運動，可到「會員資料」頁面設定。</p>';
      } else {
        html += '<div class="icon-grid">' + profile.favoriteSports.map((id) => `
          <div class="icon-button">
            <img src="${sportIcon(id)}" alt="${sportName(id)}" />
            <span>${sportName(id)}</span>
          </div>
        `).join("") + "</div>";
      }

      html += "<h2>收藏的據點</h2>";
      const favoriteCards = favorites
        .map((fav) => ({ fav, venue: allVenues.find((v) => v.id === fav.venueId) }))
        .filter((x) => x.venue);

      if (!favoriteCards.length) {
        html += '<p class="hint-text">尚未收藏任何據點，瀏覽「社區活動查詢」或鄉鎮頁面時可點選 ☆ 加入收藏。</p>';
      } else {
        html += '<div class="venue-list">' + favoriteCards.map(({ fav, venue }) => {
          // 有指定運動的收藏（在某個運動的篩選畫面收藏），只顯示那項運動跟它的課程時間；
          // 沒有指定運動的收藏（收藏整個據點），維持列出所有提供的運動項目
          const sportLine = fav.sportType ? sportName(fav.sportType) : (venue.sportTypes || []).map(sportName).join("、");
          const relatedCourses = fav.sportType
            ? allCourses.filter((c) => c.venueId === venue.id && c.sportType === fav.sportType)
            : [];
          return `
            <div class="venue-card">
              <h3>${escapeHtml(venue.name)} <span class="venue-type">(${venueTypeName(venue.type)})</span> <span class="fav-slot" data-venue="${encodeURIComponent(venue.id)}" ${fav.sportType ? `data-sport="${fav.sportType}"` : ""}></span></h3>
              <p>鄉鎮：${townshipName(venue.township)}</p>
              <p>地址：${escapeHtml(venue.address)}</p>
              <p>電話：${escapeHtml(venue.phone)}</p>
              <p>運動項目：${sportLine}</p>
              ${relatedCourses.map((c) => `<p class="course-line">課程時間：${escapeHtml(c.schedule)}｜${escapeHtml(c.description)}</p>`).join("")}
            </div>
          `;
        }).join("") + "</div>";
      }

      document.getElementById("content").innerHTML = html;
      renderFavoriteToggles();
    });
  </script>
  <script src="js/favorites-widget.js"></script>
</body>
</html>
