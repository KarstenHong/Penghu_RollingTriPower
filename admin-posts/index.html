<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公告管理</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
</head>
<body>
  <div id="nav"></div>
  <main>
    <a href="/admin/" class="back-button">&larr; 返回後台首頁</a>
    <h1>最新消息／活動資訊管理</h1>
    <div id="content"><p>載入中...</p></div>
  </main>

  <script>
    let posts = [];
    let editing = null;

    async function reload() {
      posts = await getAll("posts");
      render();
    }

    function newPost() {
      editing = { category: "news", title: "", content: "", date: new Date().toISOString().slice(0, 10), imageUrl: "" };
      render();
    }

    function editPost(id) {
      editing = JSON.parse(JSON.stringify(posts.find((p) => p.id === id)));
      render();
    }

    async function deletePost(id) {
      const post = posts.find((p) => p.id === id);
      const confirmed = await showConfirmDialog(`確定要刪除「${post.title}」這則公告嗎？`, { confirmLabel: "刪除", danger: true });
      if (!confirmed) return;
      await deleteItem("posts", id);
      await reload();
    }

    async function savePost(e) {
      e.preventDefault();
      const saveBtn = e.target.querySelector('button[type="submit"]');
      const file = document.getElementById("f-image-file").files[0];

      editing.category = document.getElementById("f-category").value;
      editing.title = document.getElementById("f-title").value;
      editing.date = document.getElementById("f-date").value;
      editing.content = document.getElementById("f-content").value;

      // 上傳檔案的話優先用檔案（存進 Firestore、不會像 Google 雲端硬碟連結那樣偶爾失效），
      // 沒選檔案才照原本的方式用「圖片網址」欄位（給已經有穩定外部圖床網址的情況用）
      if (file) {
        saveBtn.disabled = true;
        saveBtn.textContent = "處理中...";
        try {
          editing.imageUrl = await fileToCompressedDataUrl(file);
        } catch (err) {
          alert(`「${file.name}」處理失敗：${err.message}`);
          saveBtn.disabled = false;
          saveBtn.textContent = "儲存";
          return;
        }
      } else {
        // 網址欄位空白時不動 editing.imageUrl：已經上傳過照片的話，畫面上這欄位是刻意留空的
        // （見下面 imageUrlFieldValue 的說明），空白不代表要清掉現有圖片
        const urlValue = document.getElementById("f-image").value.trim();
        if (urlValue) editing.imageUrl = normalizeImageUrl(urlValue);
      }

      if (editing.id) {
        await setItem("posts", editing.id, editing);
      } else {
        await addItem("posts", editing);
      }
      editing = null;
      await reload();
      showToast("已儲存");
    }

    function render() {
      document.getElementById("content").innerHTML = `
        <button class="primary-button" onclick="newPost()" style="display: block; margin: 0.8rem 0 1.2rem;">+ 新增公告</button>
        <div class="table-scroll"><table class="admin-table">
          <thead><tr><th>分類</th><th>標題</th><th>日期</th><th></th></tr></thead>
          <tbody>
            ${posts.map((p) => `
              <tr>
                <td>${p.category === "event" ? "活動資訊" : "最新消息"}</td>
                <td>${escapeHtml(p.title)}</td>
                <td>${escapeHtml(p.date)}</td>
                <td>
                  <button onclick="editPost('${p.id}')">編輯</button>
                  <button onclick="deletePost('${p.id}')">刪除</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table></div>
      `;

      if (!editing) { renderEditModal(null); return; }

      // 上傳過的圖片網址欄位存的是很長的 Base64 字串，不適合整串塞進文字輸入框讓人誤改，
      // 顯示成空白就好，靠上面的縮圖預覽提示「已經有圖片了」
      const imageUrlFieldValue = (editing.imageUrl || "").startsWith("data:") ? "" : editing.imageUrl;

      renderEditModal(`
        <form class="member-form" id="post-form">
          <label>分類
            <select id="f-category">
              <option value="news" ${editing.category === "news" ? "selected" : ""}>最新消息</option>
              <option value="event" ${editing.category === "event" ? "selected" : ""}>活動資訊</option>
            </select>
          </label>
          <label>標題 <input type="text" id="f-title" value="${escapeHtml(editing.title)}" required /></label>
          <label>日期 <input type="date" id="f-date" value="${escapeHtml(editing.date)}" /></label>
          <label>內容 <textarea id="f-content">${escapeHtml(editing.content)}</textarea></label>
          <label>上傳圖片（選填，會取代下面的圖片網址） <input type="file" id="f-image-file" accept="image/*" /></label>
          ${editing.imageUrl ? `<img src="${escapeHtml(editing.imageUrl)}" alt="" style="width:100px;height:100px;object-fit:cover;border-radius:8px;" />` : ""}
          <label>圖片網址（選填，貼 Google 雲端硬碟共用連結也可以，但不如上傳穩定） <input type="text" id="f-image" value="${escapeHtml(imageUrlFieldValue)}" /></label>
          <button type="submit" class="primary-button">儲存</button>
          <button type="button" class="secondary-button" onclick="editing = null; render();">取消</button>
        </form>
      `);

      document.getElementById("post-form").addEventListener("submit", savePost);
    }

    requireAdmin(() => reload());
  </script>
</body>
</html>
